spring:
  application:
    name: backend

  datasource:
    driver-class-name: org.h2.Driver
    url: ${DB_H2_URL}
    username: ${DB_H2_USERNAME}
    password: ${DB_H2_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace