spring:
  config:
    activate:
      on-profile: local

  cloud:
    aws:
      parameterstore:
        enabled: false

  datasource:
    driver-class-name: org.h2.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: update

      properties:
        hibernate:
          format_sql: true

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace